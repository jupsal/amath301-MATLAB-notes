<!--
  One-time "What's new" message (bottom-right corner, does not block the page).

  Each student sees it once per browser: after they close it (or click a
  button in it), it doesn't come back. To announce something new later,
  change NOTICE_ID below (for example to "2027-01-new-thing") and edit the
  text; everyone will see the new message once.

  SHOW_UNTIL: after this date the message stops appearing for everyone.
  Set it to "" to show it with no end date.
  To turn the message off entirely, remove _whats-new.html from
  include-after-body in _quarto.yml.
-->
<style>
  #whats-new {
    position: fixed;
    right: 1.25rem;
    bottom: 1.25rem;
    z-index: 2000;
    max-width: 22rem;
    padding: 1rem 1.1rem 0.9rem;
    border-radius: 0.5rem;
    border: 1px solid #dee2e6;
    background: #ffffff;
    color: #212529;
    box-shadow: 0 0.5rem 1.5rem rgba(0, 0, 0, 0.2);
    font-size: 0.95rem;
    line-height: 1.45;
  }
  body.quarto-dark #whats-new { background: #2b3035; color: #e9ecef; border-color: #495057; }
  #whats-new[hidden] { display: none; }
  #whats-new h2 {
    margin: 0 0 0.4rem;
    padding: 0;
    border: 0;
    font-size: 1.05rem;
    font-weight: 700;
  }
  #whats-new p { margin: 0 0 0.75rem; }
  #whats-new .wn-buttons { display: flex; gap: 0.5rem; flex-wrap: wrap; }
  #whats-new button {
    font: inherit;
    font-size: 0.9rem;
    padding: 0.3rem 0.75rem;
    border-radius: 0.35rem;
    cursor: pointer;
  }
  #whats-new .wn-primary { background: #4b2e83; color: #fff; border: 1px solid #4b2e83; }
  #whats-new .wn-secondary { background: transparent; color: inherit; border: 1px solid currentColor; }
  #whats-new button:focus-visible { outline: 3px solid #b7a57a; outline-offset: 2px; }
  #whats-new .wn-close {
    position: absolute;
    top: 0.35rem;
    right: 0.45rem;
    border: 0;
    background: transparent;
    color: inherit;
    font-size: 1.3rem;
    line-height: 1;
    padding: 0.2rem 0.4rem;
  }
  @media (max-width: 600px) {
    #whats-new { left: 1rem; right: 1rem; bottom: 1rem; max-width: none; }
  }
</style>

<section id="whats-new" role="region" aria-labelledby="whats-new-title" hidden>
  <button type="button" class="wn-close" aria-label="Close this message">×</button>
  <h2 id="whats-new-title">New: dark mode</h2>
  <p>
    These notes now have a dark mode. To switch at any time, use the
    <strong>toggle switch next to the title</strong>, "AMATH 301 Course Notes".
    On a computer, it's in <strong>All chapters</strong> (the gray bar on the
    left). On a phone, tap the menu button at the top left.
  </p>
  <div class="wn-buttons">
    <button type="button" class="wn-primary" data-action="try"></button>
    <button type="button" class="wn-secondary" data-action="close">Got it</button>
  </div>
</section>

<script>
(function () {
  var NOTICE_ID = "2026-11-dark-mode";
  var SHOW_UNTIL = "2026-11-14";   // YYYY-MM-DD, or "" for no end date
  var KEY = "amath301-seen-" + NOTICE_ID;

  var box = document.getElementById("whats-new");
  if (!box) return;
  if (SHOW_UNTIL && new Date() > new Date(SHOW_UNTIL + "T23:59:59")) return;
  try { if (localStorage.getItem(KEY)) return; } catch (e) { return; }

  var tryBtn = box.querySelector('[data-action="try"]');
  function isDark() { return document.body.classList.contains("quarto-dark"); }
  function label() { tryBtn.textContent = isDark() ? "Switch back to light mode" : "Try dark mode"; }

  function dismiss() {
    try { localStorage.setItem(KEY, "1"); } catch (e) {}
    box.hidden = true;
  }

  tryBtn.addEventListener("click", function () {
    if (window.quartoToggleColorScheme) window.quartoToggleColorScheme();
    label();
    try { localStorage.setItem(KEY, "1"); } catch (e) {}   // seen; keep it open so they can switch back
  });
  box.querySelector('[data-action="close"]').addEventListener("click", dismiss);
  box.querySelector(".wn-close").addEventListener("click", dismiss);
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && !box.hidden) dismiss();
  });

  label();
  box.hidden = false;
})();
</script>
