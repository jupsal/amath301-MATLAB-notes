<!--
  Sidebar layout (wide screens, at least 992px).

  Both sidebars work the same way:
  - Each has a thin light-gray bar on its edge of the screen. Click the bar
    to open or close that sidebar. "All chapters" (left) starts closed;
    "Sections in this chapter" (right) starts open.
  - When a sidebar is open, drag its inner edge to make it narrower or wider
    (or focus the edge with Tab and use the arrow keys). Double-click the
    edge to reset the width.
  - Each student's choices (open/closed and widths) are remembered in their
    browser. Pressing "/" (search) opens All chapters so the search box shows.

  Narrower screens (phones, small windows) keep Quarto's normal layout.

  Settings you might change are the variables at the top of the <style>
  and DEFAULTS at the top of the <script>.
  To go back to Quarto's default sidebars, remove _sidebars.html from
  include-after-body in _quarto.yml.
-->
<style>
@media (min-width: 992px) {
  body.sb-layout {
    --sb-rail: 30px;          /* width of each gray bar */
    --sb-left: 270px;         /* All chapters width (set by dragging) */
    --sb-right: 240px;        /* Sections in this chapter width (set by dragging) */
    --sb-read: 860px;         /* maximum width of the page text */
    --sb-bg: #f1f3f5;         /* light gray */
    --sb-border: #dee2e6;
    --sb-text: #343a40;
    --sb-offL: calc(var(--sb-rail) + var(--sb-left));
    --sb-offR: calc(var(--sb-rail) + var(--sb-right));
  }
  body.sb-layout.sb-left-closed  { --sb-offL: var(--sb-rail); }
  body.sb-layout.sb-right-closed { --sb-offR: var(--sb-rail); }
  body.sb-layout.quarto-dark {
    --sb-bg: #2b3035;
    --sb-border: #495057;
    --sb-text: #e9ecef;
  }

  /* ---- Page text: fills the space between the sidebars ---- */
  body.sb-layout #quarto-content main.content {
    grid-column: screen-start / screen-end;
    width: auto;
    max-width: none;
    margin-left:  calc(var(--sb-offL) + max(2rem, (100vw - var(--sb-offL) - var(--sb-offR) - var(--sb-read)) / 2));
    margin-right: calc(var(--sb-offR) + max(2rem, (100vw - var(--sb-offL) - var(--sb-offR) - var(--sb-read)) / 2));
  }
  body.sb-layout .nav-footer { padding-left: var(--sb-offL); padding-right: var(--sb-offR); }

  /* ---- The gray bars ---- */
  .sb-rail {
    display: flex;
    position: fixed;
    top: 0; bottom: 0;
    width: var(--sb-rail);
    z-index: 1031;
    margin: 0; padding: 1rem 0;
    align-items: flex-start;
    justify-content: center;
    background: var(--sb-bg);
    color: var(--sb-text);
    border: none;
    cursor: pointer;
    font: inherit;
    font-size: 0.85rem;
  }
  #sb-rail-left  { left: 0;  border-right: 1px solid var(--sb-border); }
  #sb-rail-right { right: 0; border-left: 1px solid var(--sb-border); }
  .sb-rail:hover { filter: brightness(0.96); }
  body.quarto-dark .sb-rail:hover { filter: brightness(1.15); }
  .sb-rail:focus-visible { outline: 3px solid #4b2e83; outline-offset: -3px; }
  .sb-rail span { writing-mode: vertical-rl; letter-spacing: 0.03em; white-space: nowrap; }
  #sb-rail-left span { transform: rotate(180deg); }   /* reads bottom to top */

  /* ---- The panels ---- */
  body.sb-layout #quarto-sidebar,
  body.sb-layout #quarto-margin-sidebar {
    position: fixed !important;
    top: 0; bottom: 0;
    height: 100vh !important;
    max-height: 100vh !important;
    overflow-y: auto;
    z-index: 1030;
    background: var(--sb-bg);
  }
  body.sb-layout #quarto-sidebar {
    left: var(--sb-rail);
    width: var(--sb-left) !important;
    border-right: 1px solid var(--sb-border);
    padding: 1rem 1rem 3rem 1rem;
  }
  body.sb-layout #quarto-margin-sidebar {
    right: var(--sb-rail);
    left: auto !important;
    width: var(--sb-right) !important;
    border-left: 1px solid var(--sb-border);
    padding: 1.5rem 1rem 3rem 1.25rem;
  }
  body.sb-layout #quarto-margin-sidebar nav#TOC { position: static !important; max-height: none !important; }
  body.sb-layout.sb-left-closed  #quarto-sidebar,
  body.sb-layout.sb-right-closed #quarto-margin-sidebar { display: none !important; }

  /* ---- Drag handles on the inner edge of each open panel ---- */
  .sb-handle {
    display: block;
    position: fixed;
    top: 0; bottom: 0;
    width: 8px;
    z-index: 1032;
    cursor: col-resize;
    background: transparent;
  }
  #sb-handle-left  { left:  calc(var(--sb-rail) + var(--sb-left) - 4px); }
  #sb-handle-right { right: calc(var(--sb-rail) + var(--sb-right) - 4px); }
  body.sb-left-closed  #sb-handle-left,
  body.sb-right-closed #sb-handle-right { display: none; }
  .sb-handle:hover, .sb-handle.sb-dragging, .sb-handle:focus-visible {
    background: linear-gradient(to right, transparent 3px, #adb5bd 3px, #adb5bd 5px, transparent 5px);
    outline: none;
  }
  body.sb-noselect, body.sb-noselect * { user-select: none !important; cursor: col-resize !important; }
}
@media (max-width: 991.98px) {
  .sb-rail, .sb-handle { display: none !important; }
}
</style>

<button type="button" id="sb-rail-left" class="sb-rail" aria-controls="quarto-sidebar"><span></span></button>
<button type="button" id="sb-rail-right" class="sb-rail" aria-controls="quarto-margin-sidebar"><span></span></button>
<div id="sb-handle-left" class="sb-handle" role="separator" aria-orientation="vertical" tabindex="0"
     aria-label="Resize All chapters (use the left and right arrow keys)"></div>
<div id="sb-handle-right" class="sb-handle" role="separator" aria-orientation="vertical" tabindex="0"
     aria-label="Resize Sections in this chapter (use the left and right arrow keys)"></div>

<script>
(function () {
  var DEFAULTS = {
    left:  { open: false, width: 270, min: 180, max: 480, label: "Course notes index and search" },
    right: { open: true,  width: 240, min: 140, max: 460, label: "Sections in this chapter" }
  };
  var wide = window.matchMedia("(min-width: 992px)");
  var body = document.body;
  var panels = {
    left:  document.getElementById("quarto-sidebar"),
    right: document.getElementById("quarto-margin-sidebar")
  };
  if (panels.right && !panels.right.querySelector("nav#TOC, #TOC")) panels.right = null;

  function get(k) { try { return localStorage.getItem("amath301-sb-" + k); } catch (e) { return null; } }
  function set(k, v) { try { localStorage.setItem("amath301-sb-" + k, v); } catch (e) {} }

  function setup(side) {
    var d = DEFAULTS[side];
    var rail = document.getElementById("sb-rail-" + side);
    var handle = document.getElementById("sb-handle-" + side);
    var panel = panels[side];
    if (!panel) {
      rail.remove(); handle.remove();
      body.classList.add("sb-" + side + "-closed");
      body.style.setProperty("--sb-" + side, "0px");
      return null;
    }

    function isOpen() {
      var v = get(side + "-open");
      return v === null ? d.open : v === "yes";
    }
    function applyOpen() {
      var open = isOpen();
      body.classList.toggle("sb-" + side + "-closed", !open);
      rail.setAttribute("aria-expanded", open ? "true" : "false");
      rail.firstChild.textContent = open ? "Hide " + d.label.toLowerCase() : d.label;
    }
    function toggle(open) {
      set(side + "-open", open ? "yes" : "no");
      applyOpen();
    }
    rail.addEventListener("click", function () {
      var open = !isOpen();
      toggle(open);
      if (open) {
        var first = panel.querySelector("input, a");
        if (first) first.focus({ preventScroll: true });
      }
    });

    function clamp(w) { return Math.max(d.min, Math.min(d.max, w, window.innerWidth * 0.35)); }
    function setWidth(w, save) {
      w = Math.round(clamp(w));
      body.style.setProperty("--sb-" + side, w + "px");
      handle.setAttribute("aria-valuenow", String(w));
      if (save) set(side + "-width", String(w));
    }
    function current() {
      return parseInt(getComputedStyle(body).getPropertyValue("--sb-" + side), 10) || d.width;
    }
    // Width from the pointer position: distance from the screen edge, minus the bar.
    function fromPointer(x) {
      var rail = parseInt(getComputedStyle(body).getPropertyValue("--sb-rail"), 10) || 30;
      return side === "left" ? x - rail : window.innerWidth - x - rail;
    }
    handle.setAttribute("aria-valuemin", String(d.min));
    handle.setAttribute("aria-valuemax", String(d.max));
    handle.addEventListener("pointerdown", function (e) {
      e.preventDefault();
      handle.setPointerCapture(e.pointerId);
      handle.classList.add("sb-dragging");
      body.classList.add("sb-noselect");
    });
    handle.addEventListener("pointermove", function (e) {
      if (handle.classList.contains("sb-dragging")) setWidth(fromPointer(e.clientX), false);
    });
    function endDrag(e) {
      if (!handle.classList.contains("sb-dragging")) return;
      handle.classList.remove("sb-dragging");
      body.classList.remove("sb-noselect");
      setWidth(fromPointer(e.clientX), true);
    }
    handle.addEventListener("pointerup", endDrag);
    handle.addEventListener("pointercancel", endDrag);
    handle.addEventListener("dblclick", function () { setWidth(d.width, true); });
    handle.addEventListener("keydown", function (e) {
      // Arrow keys move the edge in that direction.
      var grow = side === "left" ? "ArrowRight" : "ArrowLeft";
      var shrink = side === "left" ? "ArrowLeft" : "ArrowRight";
      if (e.key === grow)   { setWidth(current() + 20, true); e.preventDefault(); }
      if (e.key === shrink) { setWidth(current() - 20, true); e.preventDefault(); }
    });

    return {
      apply: function () { applyOpen(); setWidth(parseInt(get(side + "-width"), 10) || d.width, false); },
      isOpen: isOpen,
      open: function () { toggle(true); }
    };
  }

  var L = setup("left");
  var R = setup("right");

  // "/" opens Quarto's search: show All chapters so the search box is visible.
  document.addEventListener("keydown", function (e) {
    var tag = (e.target && e.target.tagName) || "";
    if (L && e.key === "/" && wide.matches && !L.isOpen() && !/INPUT|TEXTAREA|SELECT/.test(tag)) L.open();
  }, true);

  function apply() {
    body.classList.toggle("sb-layout", wide.matches);
    if (L) L.apply();
    if (R) R.apply();
  }
  if (wide.addEventListener) wide.addEventListener("change", apply);
  apply();
})();
</script>
